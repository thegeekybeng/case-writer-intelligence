# Rate limiting zones
limit_req_zone $binary_remote_addr zone=cwi_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=cwi_ai:10m rate=20r/m;

log_format custom_telemetry '[TELEMETRY] PATH=$request_uri REF=$http_referer UA=$http_user_agent STATUS=$status';

server {
    listen 8080;
    server_name localhost your-domain.example.com;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

    access_log /dev/stdout custom_telemetry;

    # --- HEALTH CHECK ---
    location /api/health {
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"case-writer-intelligence"}';
    }

    # --- CAUSALITY ENGINE (OpenAI-compat) → cwi-ai-proxy ---
    # causalityEngine.ts uses OpenAI SDK which calls /api/v1/chat/completions.
    # Route through the secure proxy so all security controls apply.
    location /api/v1/ {
        limit_req zone=cwi_ai burst=5 nodelay;
        limit_req_status 429;

        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://cwi-ai-proxy:3101/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;            # Required for SSE — flush tokens immediately
        add_header X-Accel-Buffering no;
    }

    # --- LOGIN ENDPOINT — publicly reachable (browser must POST credentials here) ---
    # Rate-limited to prevent brute force; no IP restriction needed as
    # the proxy validates username+password and issues a short-lived JWT.
    location = /api/ai/login {
        limit_req zone=cwi_ai burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://cwi-ai-proxy:3101/api/ai/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # --- SERVER-SIDE AI PROXY (replaces direct Ollama access) ---
    # Browser calls /api/ai/ → cwi-ai-proxy container → Ollama
    # System prompt and all security logic live in the proxy, not the browser.
    # All endpoints except /login are restricted to Docker internal IPs.
    location /api/ai/ {
        limit_req zone=cwi_ai burst=5 nodelay;
        limit_req_status 429;

        # Restrict to Docker internal network only — login is handled above
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://cwi-ai-proxy:3101/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # --- SPA ROUTING ---
    location / {
        limit_req zone=cwi_general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 405 =200 /index.html;
    error_page 429 @too_many_requests;
    error_page 500 502 503 504 /index.html;

    location @too_many_requests {
        return 429 '{"error":"Rate limit exceeded. Please wait before retrying."}';
        add_header Content-Type application/json;
    }
}
