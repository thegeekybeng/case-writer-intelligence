# Telemetry Format
log_format custom_telemetry '[TELEMETRY] IP=$http_x_forwarded_for PATH=$request_uri REF=$http_referer UA=$http_user_agent';

# --- 1. SERVER CONFIG ---
server {
    listen 8080;
    server_name localhost cwi.thegeekybeng.com;

    root /usr/share/nginx/html;
    index index.html;

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https: http:;";

    access_log /dev/stdout custom_telemetry;

    # --- 1.1 HEALTH CHECK ENDPOINT ---
    location /api/health {
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"case-writer-intelligence"}';
    }

    # --- 1.2 OLLAMA PROXY (BYPASSES MIXED CONTENT) ---
    # Browser calls /api/v1/* -> nginx proxies to ollama container via ai-bridge network
    location /api/v1/ {
        proxy_pass http://100.95.235.61:11434/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for streaming
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- 1.2.1 BONSAI PROXY ---
    location /api/bonsai/ {
        proxy_pass http://100.95.235.61:11436/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- 1.3 SPA ROUTING (CRITICAL: Handles all routes) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 1.4 ERROR PAGES ---
    error_page 404 /index.html;
    error_page 405 =200 /index.html;
    error_page 500 502 503 504 /index.html;
}
