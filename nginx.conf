# Rate limiting zones
limit_req_zone $binary_remote_addr zone=cwi_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=cwi_ai:10m rate=20r/m;

# Telemetry Format — IP omitted (PDPA compliance)
log_format custom_telemetry '[TELEMETRY] PATH=$request_uri REF=$http_referer UA=$http_user_agent STATUS=$status';

# --- SERVER CONFIG ---
server {
    listen 8080;
    server_name localhost cwi.thegeekybeng.com;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

    access_log /dev/stdout custom_telemetry;

    # --- HEALTH CHECK (unrestricted) ---
    location /api/health {
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"case-writer-intelligence"}';
    }

    # --- OLLAMA PROXY (IP-restricted + rate limited) ---
    location /api/v1/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        limit_req zone=cwi_ai burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://100.95.235.61:11434/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- BONSAI PROXY (IP-restricted + rate limited) ---
    location /api/bonsai/ {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        limit_req zone=cwi_ai burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://100.95.235.61:11436/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # --- SPA ROUTING ---
    location / {
        limit_req zone=cwi_general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 405 =200 /index.html;
    error_page 429 @too_many_requests;
    error_page 500 502 503 504 /index.html;

    location @too_many_requests {
        return 429 '{"error":"Rate limit exceeded. Please wait before retrying."}';
        add_header Content-Type application/json;
    }
}
