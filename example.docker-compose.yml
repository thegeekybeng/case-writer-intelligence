# EXAMPLE — Copy to docker-compose.yml and configure for your environment
services:
  case-writer-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cwi-app
    ports:
      - "3081:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - ai-bridge
    depends_on:
      cwi-ai-proxy:
        condition: service_healthy

  # Server-side AI proxy — system prompt, PII masking, canary tokens,
  # injection sanitization, and audit logging all live here.
  # The browser never contacts the inference server directly.
  cwi-ai-proxy:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cwi-ai-proxy
    environment:
      # TODO: Set your Ollama / OpenAI-compatible endpoint
      - OLLAMA_ENDPOINT=http://ollama-host:11434/v1/chat/completions
      # TODO: Set your model — test the causality engine end-to-end after changing
      - AI_MODEL=gemma4:e4b
      - PORT=3101
      # TODO: Set admin credentials (used for auto-scan login)
      - ADMIN_USER=change-me-admin-user
      - ADMIN_PASS=change-me-strong-password
      # TODO: Generate with: openssl rand -hex 32
      - JWT_SECRET=generate-with-openssl-rand-hex-32
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - ai-bridge

networks:
  ai-bridge:
    external: true
