# EXAMPLE — Copy to docker-compose.lowmem.yml for constrained environments
services:
  case-writer-intelligence:
    build: .
    container_name: cwi-app
    ports:
      - "3081:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      NODE_OPTIONS: --max-old-space-size=192
