# --- 1. SERVICES CONFIGURATION ---
services:
  # --- 1.1 APP SERVICE ---
  writer-copilot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time injection — VITE_ vars must be ARGs to be baked into bundle
        - VITE_ADMIN_USER=${VITE_ADMIN_USER}
        - VITE_ADMIN_PASS=${VITE_ADMIN_PASS}
    container_name: cwi-app
    ports:
      - "3081:8080"
    environment:
      - OLLAMA_HOST=http://100.95.235.61:11434/v1
      - AI_MODEL=qwen3.5:4b-nvfp4
      # VITE_ADMIN_USER and VITE_ADMIN_PASS are build-time only (baked via ARG above)
      # They are not needed as runtime env vars — nginx has no process to read them
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - ai-bridge

networks:
  ai-bridge:
    external: true   # owned by infrastructure/docker-compose.ai.yml
