services:
  case-writer-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_ADMIN_USER=${VITE_ADMIN_USER}
        - VITE_ADMIN_PASS=${VITE_ADMIN_PASS}
        # OLLAMA_HOST removed — AI now goes via server-side proxy
    container_name: cwi-app
    ports:
      - "3081:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - ai-bridge
    depends_on:
      cwi-ai-proxy:
        condition: service_healthy

  # Server-side AI proxy — system prompt, PII masking, canary tokens,
  # injection sanitization, and audit logging all live here.
  # The browser never contacts Ollama directly.
  cwi-ai-proxy:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cwi-ai-proxy
    environment:
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://100.95.235.61:11434/v1/chat/completions}
      - AI_MODEL=${AI_MODEL:-gemma4:12b-mlx}
      - PORT=3101
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - ai-bridge

networks:
  ai-bridge:
    external: true
